<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 965" width="960" height="965" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>Homelab network</title>
<desc>Two sites, JD and LINDS. Each has a Debian router VM behind an NBN service. The routers are joined by an IPsec tunnel and exchange routes over BGP. Each site has a main LAN and several VLANs.</desc>
<rect width="960" height="965" rx="14" fill="#0d1117"/>
<text x="24" y="38" font-size="21" fill="#e6edf3" font-weight="700">Network</text>
<text x="24" y="59" font-size="12.5" fill="#9da9b6">Two sites, one routed network. Read from the routers on 20 Nov 2026.</text>
<rect x="24" y="80" width="262" height="59" rx="9" fill="#1c2430" stroke="#303a48" stroke-width="1"/>
<rect x="32" y="89" width="3.5" height="41" rx="1.75" fill="#8b97a5"/>
